<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200" role="img" aria-label="pi-legwork: forty file reads happen in a pi agent session; one short answer returns to Claude Code">
  <style>
    .t   { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .lbl { font-size: 13px; fill: #8b949e; }
    .big { font-size: 15px; font-weight: 600; }
    .sm  { font-size: 11px; fill: #8b949e; }
    .cal { fill: #58a6ff; }
    .del { fill: #d29922; }
    .box { fill: none; stroke-width: 1.5; }
    .bcal { stroke: #58a6ff; }
    .bdel { stroke: #d29922; }
    .churn { stroke: #d29922; stroke-width: 1; opacity: .45; }
    .ret { stroke: #3fb950; stroke-width: 2; }
    .name { font-size: 22px; font-weight: 700; fill: #58a6ff; }
  </style>

  <!-- One text element, not two. At x=24 the 22px monospace name runs to about
       x=156, and the tagline used to start at a hard-coded x=152, so they
       collided by a few pixels and read as "pi-legworkdelegate". Tspans space
       themselves from the glyphs actually rendered, so this cannot drift again
       when the font falls back. -->
  <text x="24" y="34" class="t"><tspan class="name">pi-legwork</tspan><tspan class="lbl">: delegate the legwork, keep the judgment</tspan></text>

  <!-- caller -->
  <rect x="24" y="62" width="150" height="86" rx="6" class="box bcal"/>
  <text x="99" y="90" class="t big cal" text-anchor="middle">Claude Code</text>
  <text x="99" y="108" class="t sm" text-anchor="middle">or Codex</text>
  <text x="99" y="132" class="t sm" text-anchor="middle">context stays clean</text>

  <!-- delegate -->
  <rect x="380" y="62" width="196" height="86" rx="6" class="box bdel"/>
  <text x="478" y="90" class="t big del" text-anchor="middle">pi agent</text>
  <text x="478" y="108" class="t sm" text-anchor="middle">cheaper model</text>
  <text x="478" y="132" class="t sm" text-anchor="middle">40 reads · greps · dead ends</text>

  <!-- churn lines, staying on the delegate side -->
  <g class="churn">
    <path d="M576 74 q26 12 0 24" fill="none"/>
    <path d="M576 96 q30 14 0 28" fill="none"/>
    <path d="M576 120 q24 10 0 20" fill="none"/>
  </g>

  <!-- task out -->
  <line x1="176" y1="92" x2="376" y2="92" class="box bcal" stroke-dasharray="4 4"/>
  <polygon points="376,92 368,88 368,96" fill="#58a6ff"/>
  <text x="276" y="84" class="t sm" text-anchor="middle">task</text>

  <!-- answer back -->
  <line x1="378" y1="124" x2="178" y2="124" class="ret"/>
  <polygon points="178,124 186,120 186,128" fill="#3fb950"/>
  <text x="276" y="142" class="t sm" text-anchor="middle" fill="#3fb950">10 rows + file path</text>

  <text x="300" y="180" class="t sm" text-anchor="middle">the churn never crosses back</text>
</svg>
